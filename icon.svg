    <rect x="-9" y="-39.5" width="18" height="3.4" rx="1.7" fill="#19E06A" stroke="#0E1A14" stroke-width=".8"/>
    <rect x="-1.7" y="-49" width="3.4" height="9.5" rx="1" fill="#0E1A14"/>
    <circle cx="0" cy="-51.5" r="3.2" fill="#19E06A" stroke="#0E1A14" stroke-width=".8"/>
  </g>
  <!-- shield body -->
  <path d="M32 3 L59 12.5 V34 C59 51 47 63 32 69 C17 63 5 51 5 34 V12.5 Z" fill="#0E1A14"/>
