  <!-- visor slits, read as lines of code -->
  <rect x="16" y="29" width="32" height="4" rx="2" fill="#19E06A"/>
  <rect x="16" y="37" width="24" height="4" rx="2" fill="#19E06A"/>
  <rect x="16" y="45" width="13" height="4" rx="2" fill="#19E06A"/>
  <rect x="32" y="44" width="5" height="6" rx="1" fill="#FFFFFF"/>
</svg>
